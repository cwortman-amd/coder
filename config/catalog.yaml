# GPU envelope numbers, model identity, and the container each checkpoint is served in.
# Serving recipes stay in lib/gpu_profile.sh and lib/model_profile.sh.
# Bash reads this file only through scripts/catalog.py.

gpus:
  r9700:
    tdp_w: 300.0
    peak_bw_gbs: 960.0
    vram_gb: 32
    video_gid_fallback: 44
    render_gid_fallback: 109
  mi350p:
    tdp_w: 600.0
    peak_bw_gbs: 4096.0
    vram_gb: 144
    video_gid_fallback: 44
    render_gid_fallback: 109
  r9600:
    tdp_w: 150.0
    peak_bw_gbs: 640.0
    vram_gb: 32
    video_gid_fallback: 44
    render_gid_fallback: 109

gpu_aliases:
  gfx1201: r9700
  radeon: r9700
  r9700s: r9700
  gfx950: mi350p
  mi350: mi350p
  instinct: mi350p
  r9600d: r9600

# weight_gib is the streaming-footprint figure the token replay estimate uses.
# It is the Qwen MXFP4 serving footprint, not a vendor spec.
models:
  qwen3.8:
    model_id: Qwen/Qwen3.8-27B-FP8
    mxfp4_id: Qwen3.8-27B-Quark-AWQ-MXFP4
    weight_gib: 17.91
    container: rocm-inference-server
    mxfp4_container: rocm-mxfp4-server
  gpt-oss-20b:
    model_id: openai/gpt-oss-20b
    weight_gib: null
    container: rocm-gpt-oss-server
  gpt-oss-120b:
    model_id: openai/gpt-oss-120b
    weight_gib: null
    container: aim-gptoss

model_aliases:
  qwen: qwen3.8
  qwen3.8-27b: qwen3.8
  gpt-oss: gpt-oss-20b

containers:
  inference:
    name: rocm-inference-server
  mxfp4:
    name: rocm-mxfp4-server
  pd_decode:
    name: rocm-mxfp4-pd-decode
    port: 8200
    gpu: 0
  pd_prefill:
    name: rocm-mxfp4-pd-prefill
    port: 8100
    gpu: 1
  gpt_oss:
    name: rocm-gpt-oss-server
  flash_next:
    name: rocm-flash-next-server
  ep:
    name: rocm-ep-server
  scaling:
    name: rocm-scaling-server
  aim_gptoss:
    name: aim-gptoss
