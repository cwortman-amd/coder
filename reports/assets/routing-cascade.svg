<text x="48.0" y="42.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#00c2de" text-anchor="start" letter-spacing="2.2">LLM ROUTING</text>
<text x="48.0" y="140.0" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="start">Cascade vs.</text>
<text x="48.0" y="186.0" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="start">fallback routing</text>
<text x="48.0" y="228.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#C1A968" text-anchor="start">Escalation solves quality.</text>
<text x="48.0" y="250.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#00c2de" text-anchor="start">Fallback solves availability.</text>
<text x="48.0" y="430.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#9aa3ad" text-anchor="start">Use cascade when the first</text>
<text x="48.0" y="450.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#9aa3ad" text-anchor="start">answer is not good enough.</text>
<text x="48.0" y="478.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#9aa3ad" text-anchor="start">Use fallback when the</text>
<text x="48.0" y="498.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#9aa3ad" text-anchor="start">preferred model cannot respond.</text>
