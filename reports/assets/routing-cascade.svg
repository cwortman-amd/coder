<text x="594.0" y="384.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Strong model</text>
<text x="594.0" y="405.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#9aa3ad" text-anchor="start">Higher capability</text>
<rect x="580.0" y="431.0" width="183.0" height="57.0" rx="10" fill="#14110C" stroke="#C1A968" stroke-width="1.5"/>
<text x="594.0" y="455.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Accept</text>
<text x="594.0" y="476.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#9aa3ad" text-anchor="start">Use the better answer</text>
<text x="596.5" y="114.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#00c2de" text-anchor="middle" letter-spacing="1.2">CASCADE ROUTING</text>
<text x="596.5" y="134.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Quality-driven escalation</text>
<text x="596.5" y="150.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#9aa3ad" text-anchor="middle">Try a fast model first. Escalate if needed.</text>
