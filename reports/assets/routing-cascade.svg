<text x="831.0" y="334.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Backup model</text>
<text x="831.0" y="355.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#9aa3ad" text-anchor="start">Next model that is up</text>
<rect x="817.0" y="381.0" width="215.0" height="57.0" rx="10" fill="#14110C" stroke="#C1A968" stroke-width="1.5"/>
<text x="831.0" y="405.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Respond</text>
<text x="831.0" y="426.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#9aa3ad" text-anchor="start">Continue with the task</text>
<text x="924.5" y="114.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#00c2de" text-anchor="middle" letter-spacing="1.2">FALLBACK ROUTING</text>
<text x="924.5" y="134.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Availability-driven recovery</text>
<text x="924.5" y="150.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#9aa3ad" text-anchor="middle">If the preferred model cannot respond.</text>
