      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-109}"
    environment:
      - HIP_VISIBLE_DEVICES=1
      - ROCR_VISIBLE_DEVICES=1
      - PYTORCH_ROCM_ARCH=${PYTORCH_ROCM_ARCH:-gfx1201}
      - GPU_PROFILE=${GPU_PROFILE:-r9700}
      - RADIANCE_MXFP4=1
      - RADIANCE_FP8_KV=1
    volumes:
      - ${MODELS_DIR:-../models}:/models:ro
      - ${HF_HOME:-$HOME/.cache/huggingface}:/root/.cache/huggingface
      - /dev/shm:/dev/shm
    command: >
      ${MODEL_PATH:-/models/Qwen3.8-27B-Quark-AWQ-MXFP4}
        --served-model-name ${MXFP4_MODEL_NAME:-Qwen3.8-27B-Quark-AWQ-MXFP4}
        --quantization quark
        --kv-cache-dtype fp8
        --attention-backend ROCM_AITER_UNIFIED_ATTN
        --max-model-len ${MAX_MODEL_LEN:-12288}
        --gpu-memory-utilization 0.90
        --max-num-seqs 8
        --max-num-batched-tokens 2048
        --host 127.0.0.1
        --port 8201
    restart: unless-stopped

