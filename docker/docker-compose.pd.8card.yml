# ==============================================================================
# 8-Card Server Node: Prefill/Decode Disaggregation (1P : 7D)
# Target Architecture: 1x 8-GPU Host (8x AMD Radeon AI PRO R9700 or Instinct MI350P)
# Topology:
#   - GPU 0: Dedicated Prefill Engine (Port 8100, max_num_batched_tokens=8192)
#   - GPUs 1-7: Dedicated Decode Engines (Ports 8201-8207, continuous batching)
#   - Router: P/D Fleet Router (Port 8000)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Prefill Pool (1 GPU: GPU 0)
  # ----------------------------------------------------------------------------
  prefill-0:
    image: ${MXFP4_IMAGE:-local/vllm-mxfp4:gfx1201}
    container_name: rocm-pd-8card-prefill-0
    ipc: host
    network_mode: host
    shm_size: 32g
    security_opt:
      - seccomp=unconfined
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-109}"
    environment:
      - HIP_VISIBLE_DEVICES=0
      - ROCR_VISIBLE_DEVICES=0
      - PYTORCH_ROCM_ARCH=${PYTORCH_ROCM_ARCH:-gfx1201}
      - GPU_PROFILE=${GPU_PROFILE:-r9700}
      - RADIANCE_MXFP4=1
      - RADIANCE_FP8_KV=1
    volumes:
      - ${MODELS_DIR:-../models}:/models:ro
      - ${HF_HOME:-$HOME/.cache/huggingface}:/root/.cache/huggingface
      - ../_results:/results
      - /dev/shm:/dev/shm
    command: >
      ${MODEL_PATH:-/models/Qwen3.8-27B-Quark-AWQ-MXFP4}
        --served-model-name ${MXFP4_MODEL_NAME:-Qwen3.8-27B-Quark-AWQ-MXFP4}
        --quantization quark
        --kv-cache-dtype fp8
        --attention-backend ROCM_AITER_UNIFIED_ATTN
        --max-model-len ${MAX_MODEL_LEN:-12288}
        --gpu-memory-utilization 0.90
        --max-num-seqs 4
        --max-num-batched-tokens 8192
        --host 127.0.0.1
        --port 8100
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Decode Pool (7 GPUs: GPUs 1 to 7)
  # ----------------------------------------------------------------------------
  decode-1:
    image: ${MXFP4_IMAGE:-local/vllm-mxfp4:gfx1201}
