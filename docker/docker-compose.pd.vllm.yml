# Dual homogeneous dGPUs: FP8 vLLM P/D (prefill GPU0 :8100, decode GPU1 :8200).
# Use when the MXFP4 image is not available. Set GPU_PROFILE=r9700|mi350p.
services:
  prefill:
    image: ${VLLM_IMAGE:-vllm/vllm-openai-rocm:latest}
    container_name: rocm-vllm-pd-prefill
    restart: unless-stopped
    ipc: host
    shm_size: 64g
    network_mode: host
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-109}"
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    environment:
      - HIP_VISIBLE_DEVICES=${HIP_VISIBLE_DEVICES_0:-0}
      - PYTORCH_ROCM_ARCH=${PYTORCH_ROCM_ARCH:-gfx1201}
      - GPU_ARCHS=${PYTORCH_ROCM_ARCH:-gfx1201}
      - GPU_PROFILE=${GPU_PROFILE:-r9700}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - HF_HOME=/root/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN:-}
      - SAFETENSORS_FAST_GPU=1
      - TOKENIZERS_PARALLELISM=false
      - PYTHONUNBUFFERED=1
    volumes:
      - ${HF_HOME:-${HF_CACHE_DIR:-${HOME}/.cache/huggingface}}:/root/.cache/huggingface
      - ${VLLM_CACHE_DIR:-${HOME}/.cache/vllm}:/root/.cache/vllm
      - ${TRITON_CACHE_DIR:-${HOME}/.cache/triton}:/root/.triton
      - ../_results:/results
      - ${MODELS_DIR:-../models}:/models
      - ../patches/qwen3_5_vllm030.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/models/qwen3_5.py:ro
      - ../scripts/qwen3_5_rocm10.py:/opt/python/lib/python3.14/site-packages/vllm/model_executor/models/qwen3_5.py:ro
    entrypoint: ["vllm", "serve"]
    command: >
      ${MODEL_NAME:-Qwen/Qwen3.8-27B-FP8}
      --host ${INFERENCE_BIND_HOST:-127.0.0.1}
      --port 8100
      --max-model-len ${MAX_MODEL_LEN:-9600}
      --max-num-seqs 8
      --max-num-batched-tokens 8192
      --gpu-memory-utilization ${GPU_MEM_UTIL:-0.90}
      --hf-overrides '{"architectures": ["Qwen3_5ForCausalLM"]}'
      --compilation-config='{"cudagraph_mode":"NONE"}'
      --kv-cache-memory-bytes ${KV_CACHE_MEMORY_BYTES:-1073741824}
      --enable-prefix-caching
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8100/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 300s

  decode:
    image: ${VLLM_IMAGE:-vllm/vllm-openai-rocm:latest}
    container_name: rocm-vllm-pd-decode
    restart: unless-stopped
    ipc: host
    shm_size: 64g
    network_mode: host
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-109}"
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    environment:
      - HIP_VISIBLE_DEVICES=${HIP_VISIBLE_DEVICES_1:-1}
      - PYTORCH_ROCM_ARCH=${PYTORCH_ROCM_ARCH:-gfx1201}
      - GPU_ARCHS=${PYTORCH_ROCM_ARCH:-gfx1201}
      - GPU_PROFILE=${GPU_PROFILE:-r9700}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - HF_HOME=/root/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN:-}
      - SAFETENSORS_FAST_GPU=1
      - TOKENIZERS_PARALLELISM=false
      - PYTHONUNBUFFERED=1
    volumes:
      - ${HF_HOME:-${HF_CACHE_DIR:-${HOME}/.cache/huggingface}}:/root/.cache/huggingface
      - ${VLLM_CACHE_DIR:-${HOME}/.cache/vllm}:/root/.cache/vllm
      - ${TRITON_CACHE_DIR:-${HOME}/.cache/triton}:/root/.triton
      - ../_results:/results
      - ${MODELS_DIR:-../models}:/models
      - ../patches/qwen3_5_vllm030.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/models/qwen3_5.py:ro
      - ../scripts/qwen3_5_rocm10.py:/opt/python/lib/python3.14/site-packages/vllm/model_executor/models/qwen3_5.py:ro
    entrypoint: ["vllm", "serve"]
    command: >
      ${MODEL_NAME:-Qwen/Qwen3.8-27B-FP8}
      --host ${INFERENCE_BIND_HOST:-127.0.0.1}
      --port 8200
      --max-model-len ${MAX_MODEL_LEN:-9600}
      --max-num-seqs 16
      --max-num-batched-tokens 2048
      --gpu-memory-utilization ${GPU_MEM_UTIL:-0.90}
      --hf-overrides '{"architectures": ["Qwen3_5ForCausalLM"]}'
      --compilation-config='{"cudagraph_mode":"NONE"}'
      --kv-cache-memory-bytes ${KV_CACHE_MEMORY_BYTES:-1073741824}
      --enable-prefix-caching
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8200/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 300s

  router:
    image: ${VLLM_IMAGE:-vllm/vllm-openai-rocm:latest}
    container_name: rocm-vllm-pd-router
    network_mode: host
    depends_on:
      prefill:
        condition: service_healthy
      decode:
        condition: service_healthy
    volumes:
      - ../benchmark/pd_router.py:/app/pd_router.py:ro
    entrypoint: ["python3"]
    command: >
      /app/pd_router.py
      --host ${ROUTER_BIND_HOST:-127.0.0.1}
      --port 8000
      --prefill-url http://127.0.0.1:8100/v1
      --decode-url http://127.0.0.1:8200/v1
    restart: unless-stopped
