services:
  # =========================================================================
  # Role 1: Prefill Engine pinned to Radeon AI PRO R9700 (GPU 0)
  # Computes prompt context and Key-Value representations at high throughput
  # =========================================================================
  prefill:
    image: local/vllm-mxfp4:gfx1201
    container_name: rocm-mxfp4-pd-prefill
    ipc: host
    network_mode: host
    shm_size: 16g
    security_opt:
      - seccomp:unconfined
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - "44"
      - "109"
    environment:
      - HIP_VISIBLE_DEVICES=0
      - ROCR_VISIBLE_DEVICES=0
      - PYTORCH_ROCM_ARCH=gfx1201
      - HF_HOME=/root/.cache/huggingface
      - RADIANCE_MXFP4=1
      - RADIANCE_MXFP4_W4A8=1
      - RADIANCE_FP8_KV=1
    volumes:
      - /home/amd/models:/models:ro
      - /home/amd/.cache/huggingface:/root/.cache/huggingface
      - /home/amd/workspace/coder/_results:/results
    command: >
      /models/amd/Qwen3.8-27B-Quark-AWQ-MXFP4
        --served-model-name Qwen3.8-27B-Quark-AWQ-MXFP4
        --quantization quark
        --kv-cache-dtype fp8
        --attention-backend ROCM_AITER_UNIFIED_ATTN
        --mamba-cache-dtype bfloat16
        --mamba-ssm-cache-dtype float16
        --max-model-len 12288
        --gpu-memory-utilization 0.88
        --max-num-seqs 8
        --max-num-batched-tokens 8192
        --host 0.0.0.0
        --port 8100
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8100/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  # =========================================================================
  # Role 2: Decode Engine pinned to Radeon AI PRO R9700 (GPU 1)
  # Streams autoregressive generation tokens with isolated, zero-jitter ITL
  # =========================================================================
  decode:
    image: local/vllm-mxfp4:gfx1201
    container_name: rocm-mxfp4-pd-decode
    ipc: host
    network_mode: host
    shm_size: 16g
    security_opt:
      - seccomp:unconfined
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - "44"
      - "109"
    environment:
      - HIP_VISIBLE_DEVICES=1
      - ROCR_VISIBLE_DEVICES=1
      - PYTORCH_ROCM_ARCH=gfx1201
      - HF_HOME=/root/.cache/huggingface
      - RADIANCE_MXFP4=1
      - RADIANCE_MXFP4_W4A8=1
      - RADIANCE_FP8_KV=1
    volumes:
      - /home/amd/models:/models:ro
      - /home/amd/.cache/huggingface:/root/.cache/huggingface
      - /home/amd/workspace/coder/_results:/results
    command: >
      /models/amd/Qwen3.8-27B-Quark-AWQ-MXFP4
        --served-model-name Qwen3.8-27B-Quark-AWQ-MXFP4
        --quantization quark
        --kv-cache-dtype fp8
        --attention-backend ROCM_AITER_UNIFIED_ATTN
        --mamba-cache-dtype bfloat16
        --mamba-ssm-cache-dtype float16
        --max-model-len 12288
        --gpu-memory-utilization 0.88
        --max-num-seqs 16
        --max-num-batched-tokens 2048
        --host 0.0.0.0
        --port 8200
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8200/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  # =========================================================================
  # Role 3: Prefill/Decode Disaggregation Router (Port 8000)
  # Bridges client requests across prefill (8100) and decode (8200) engines
  # =========================================================================
  router:
    image: local/vllm-mxfp4:gfx1201
    container_name: rocm-mxfp4-pd-router
    network_mode: host
    entrypoint: ["python3"]
    depends_on:
      prefill:
        condition: service_healthy
      decode:
        condition: service_healthy
    volumes:
      - /home/amd/workspace/coder/benchmark/pd_router.py:/app/pd_router.py:ro
    command: /app/pd_router.py --port 8000 --prefill-url http://127.0.0.1:8100/v1 --decode-url http://127.0.0.1:8200/v1
    restart: unless-stopped

  # =========================================================================
  # OpenCode Client Container
  # =========================================================================
  opencode:
    image: ghcr.io/anomalyco/opencode:latest
    container_name: opencode-client-pd
    depends_on:
      - router
    network_mode: host
    environment:
      - OPENCODE_CONFIG=/config/opencode.json
      - TERM=xterm-256color
    volumes:
      - /home/amd/workspace/coder/opencode.json:/config/opencode.json:ro
      - /home/amd/workspace/coder:/workspace
      - opencode-data:/root/.local/share/opencode
    stdin_open: true
    tty: true
    restart: "no"

volumes:
  opencode-data:
