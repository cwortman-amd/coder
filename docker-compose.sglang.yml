services:
  # ============================================================================
  # Inference Engine: SGLang for AMD ROCm (Radeon AI PRO R9700 / gfx1201)
  # ============================================================================
  inference:
    image: ${SGLANG_IMAGE:-rocm/sgl-dev:v0.5.15.post1-rocm720-mi35x-20260714}
    container_name: rocm-sglang-server
    restart: unless-stopped
    ipc: host
    network_mode: host
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    security_opt:
      - seccomp=unconfined
      - label=disable
    shm_size: 16g
    environment:
      - HIP_VISIBLE_DEVICES=${HIP_VISIBLE_DEVICES:-0}
      - PYTORCH_ROCM_ARCH=gfx1201
      - HSA_OVERRIDE_GFX_VERSION=12.0.1
      - HF_HOME=/root/.cache/huggingface
      - SAFETENSORS_FAST_GPU=1
    volumes:
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/root/.cache/huggingface
    command: >
      python3 -m sglang.launch_server
      --model-path ${MODEL_NAME:-Qwen3.8-27B}
      --host 0.0.0.0
      --port ${INFERENCE_PORT:-8000}
      --tp 1
      --mem-fraction-static ${GPU_MEM_UTIL:-0.85}
      --tool-call-parser ${SGLANG_TOOL_PARSER:-qwen25}
      --trust-remote-code
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:${INFERENCE_PORT:-8000}/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ============================================================================
  # Client Agent: OpenCode CLI (ghcr.io/anomalyco/opencode)
  # ============================================================================
  opencode:
    image: ${OPENCODE_IMAGE:-ghcr.io/anomalyco/opencode:latest}
    container_name: opencode-client
    restart: unless-stopped
    network_mode: host
    stdin_open: true
    tty: true
    depends_on:
      inference:
        condition: service_healthy
    environment:
      - OPENAI_BASE_URL=http://127.0.0.1:${INFERENCE_PORT:-8000}/v1
      - OPENAI_API_KEY=dummy-local-key
      - OPENCODE_MODEL=rocm-local/${MODEL_NAME:-Qwen3.8-27B}
    volumes:
      - .:/workspace
      - ./opencode.json:/root/.config/opencode/opencode.json:ro
      - opencode-data:/root/.local/share/opencode
    working_dir: /workspace
    # Automatically launches the OpenCode Web UI on port 4096 for interactive demos
    command: ["web", "--port", "${OPENCODE_PORT:-4096}", "--hostname", "0.0.0.0"]

volumes:
  opencode-data:
    name: opencode-data
